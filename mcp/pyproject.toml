[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintrack-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant read and add records in a self-hosted Fintrack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
fintrack-mcp = "fintrack_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fintrack_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
